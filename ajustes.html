<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajustes</title>
  <link rel="stylesheet" href="css/styles-ajustes.css">
</head>

<body>

  <header>
    <a href="index.html" class="cerrar">X</a>
    <h1>AJUSTES</h1>
  </header>

  <main>

    <section class="slide">
      <label for="volumen">Volumen general</label>
      <input type="range" id="volumen" min="0" max="100" value="50" class="color-volumen">
    </section>

    <section class="slide">
      <label for="musica">Volumen música</label>
      <input type="range" id="musica" min="0" max="100" value="50" class="color-musica">
    </section>

    <section class="slide">
      <label for="sonido">Volumen efectos de sonido</label>
      <input type="range" id="sonido" min="0" max="100" value="50" class="color-sonido">
    </section>

  </main>

</body>
</html>
